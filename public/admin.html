<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModHub Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="logo" href="/">◆ ModHub</a><nav><a href="/">Public site</a></nav></header>
<main class="admin"><section id="loginBox" class="panel"><h1>Admin Login</h1><p>Sign in to manage your catalog.</p><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p></section>
<section id="dash" class="hidden"><div class="head"><h1>Dashboard</h1><button onclick="logout()">Logout</button></div>
<form id="form" class="panel"><h2 id="formTitle">Add listing</h2><input id="name" placeholder="Name" required><select id="category"><option value="games">Game</option><option value="apps">App</option></select><input id="version" placeholder="Version" required><input id="size" placeholder="Size" required><input id="rating" placeholder="Rating" required><input id="icon" placeholder="Emoji icon e.g. 🎮" required><input id="download_url" placeholder="Authorized download URL (optional)"><textarea id="description" placeholder="Description" required></textarea><button>Save listing</button><button type="button" onclick="resetForm()">Cancel</button></form>
<div id="list" class="cards"></div></section></main>
<script>
let editId=null;
const $=id=>document.getElementById(id);
async function check(){let s=await fetch("/api/session").then(r=>r.json());$("loginBox").classList.toggle("hidden",s.authenticated);$("dash").classList.toggle("hidden",!s.authenticated);if(s.authenticated)load()}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});if(!r.ok){$("loginMsg").textContent="Invalid login.";return} $("loginMsg").textContent="";check()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
async function load(){let a=await fetch("/api/games").then(r=>r.json());$("list").innerHTML=a.map(x=>`<article class="card"><div class="icon">${x.icon}</div><h3>${x.name}</h3><p>v${x.version} · ${x.category}</p><button onclick='edit(${JSON.stringify(x)})'>Edit</button> <button onclick="del('${x.id}')">Delete</button></article>`).join("")}
function edit(x){editId=x.id;["name","category","version","size","rating","icon","download_url","description"].forEach(k=>$(k).value=x[k]);$("formTitle").textContent="Edit listing"}
function resetForm(){editId=null;$("form").reset();$("formTitle").textContent="Add listing"}
$("form").addEventListener("submit",async e=>{e.preventDefault();let d={};["name","category","version","size","rating","icon","download_url","description"].forEach(k=>d[k]=$(k).value);let url=editId?"/api/games/"+editId:"/api/games";let method=editId?"PUT":"POST";let r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok){alert("Could not save.");return}resetForm();load()});
async function del(id){if(!confirm("Delete this listing?"))return;await fetch("/api/games/"+id,{method:"DELETE"});load()}
check();
</script></body></html>
